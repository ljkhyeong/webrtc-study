name: ${COMPOSE_PROJECT_NAME:-round}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

services:
  edge:
    image: ${ROUND_EDGE_IMAGE:?Set ROUND_EDGE_IMAGE to an immutable release tag or digest}
    build:
      context: .
      dockerfile: Dockerfile
      target: web-runtime
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22.23.0-alpine3.24}
        CADDY_BUILDER_IMAGE: ${CADDY_BUILDER_IMAGE:-caddy:2.11.4-builder-alpine}
        CADDY_IMAGE: ${CADDY_IMAGE:-caddy:2.11.4-alpine}
        VITE_STUN_URLS: ${VITE_STUN_URLS:?Set VITE_STUN_URLS}
        VITE_ICE_TRANSPORT_POLICY: ${VITE_ICE_TRANSPORT_POLICY:-all}
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
      ROUND_DOMAIN: ${ROUND_DOMAIN:?Set ROUND_DOMAIN}
      ROUND_ACCESS_USER: ${ROUND_ACCESS_USER:?Set ROUND_ACCESS_USER}
      ROUND_ACCESS_PASSWORD_HASH: ${ROUND_ACCESS_PASSWORD_HASH:?Set ROUND_ACCESS_PASSWORD_HASH to a bcrypt cost-12 hash}
    ports:
      - '80:80/tcp'
      - '443:443/tcp'
      - '443:443/udp'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
      - backend
    cpus: '1.0'
    mem_limit: 256m
    pids_limit: 128
    depends_on:
      signaling:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test: ['CMD', 'wget', '-q', '-T', '2', '-O', '/dev/null', 'http://127.0.0.1:8080/healthz']
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 5
    logging: *default-logging

  signaling:
    image: ${ROUND_SIGNALING_IMAGE:?Set ROUND_SIGNALING_IMAGE to an immutable release tag or digest}
    build:
      context: .
      dockerfile: Dockerfile
      target: signaling-runtime
      args:
        JAVA_BUILD_IMAGE: ${JAVA_BUILD_IMAGE:-eclipse-temurin:21.0.11_10-jdk-alpine-3.23}
        JAVA_RUNTIME_IMAGE: ${JAVA_RUNTIME_IMAGE:-eclipse-temurin:21.0.11_10-jre-alpine-3.23}
    environment:
      HOST: 0.0.0.0
      PORT: '8787'
      SPRING_PROFILES_ACTIVE: production
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS to the exact HTTPS origin}
      MAX_ROOM_SIZE: ${MAX_ROOM_SIZE:-6}
      MAX_SIGNALING_CONNECTIONS: ${MAX_SIGNALING_CONNECTIONS:-1000}
      MAX_SIGNALING_CONNECTIONS_PER_CLIENT: ${MAX_SIGNALING_CONNECTIONS_PER_CLIENT:-12}
      HEARTBEAT_INTERVAL_MS: ${HEARTBEAT_INTERVAL_MS:-30000}
      SIGNALING_ABUSE_WINDOW_MS: ${SIGNALING_ABUSE_WINDOW_MS:-10000}
      SIGNALING_MAX_FRAMES_PER_SESSION: ${SIGNALING_MAX_FRAMES_PER_SESSION:-600}
      SIGNALING_MAX_FRAMES_PER_CLIENT: ${SIGNALING_MAX_FRAMES_PER_CLIENT:-1200}
      SIGNALING_MAX_FRAMES_GLOBAL: ${SIGNALING_MAX_FRAMES_GLOBAL:-3600}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:?Set TURN_SHARED_SECRET outside Git}
      TURN_URLS: ${TURN_URLS:?Set TURN_URLS}
      TURN_CREDENTIAL_TTL_SECONDS: ${TURN_CREDENTIAL_TTL_SECONDS:-600}
      TURN_CREDENTIAL_RATE_LIMIT_WINDOW_SECONDS: ${TURN_CREDENTIAL_RATE_LIMIT_WINDOW_SECONDS:-600}
      TURN_CREDENTIAL_RATE_LIMIT_MAX_REQUESTS: ${TURN_CREDENTIAL_RATE_LIMIT_MAX_REQUESTS:-12}
      TURN_CREDENTIAL_RATE_LIMIT_GLOBAL_MAX_REQUESTS: ${TURN_CREDENTIAL_RATE_LIMIT_GLOBAL_MAX_REQUESTS:-24}
      TURN_CREDENTIAL_RATE_LIMIT_MAX_CLIENTS: ${TURN_CREDENTIAL_RATE_LIMIT_MAX_CLIENTS:-10000}
    expose:
      - '8787'
    networks:
      - backend
    deploy:
      replicas: 1
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ['CMD', 'wget', '-q', '-T', '2', '-O', '/dev/null', 'http://127.0.0.1:8787/healthz']
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 5
    logging: *default-logging

  turn:
    image: ${ROUND_TURN_IMAGE:?Set ROUND_TURN_IMAGE to an immutable release tag or digest}
    build:
      context: .
      dockerfile: Dockerfile
      target: turn-runtime
      args:
        COTURN_IMAGE: ${COTURN_IMAGE:-coturn/coturn:4.14.0-r0-alpine}
    network_mode: host
    environment:
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:?Set TURN_EXTERNAL_IP to the public IPv4 address}
      TURN_RELAY_IP: ${TURN_RELAY_IP:?Set TURN_RELAY_IP to the host interface IPv4 address}
      TURN_REALM: ${TURN_REALM:?Set TURN_REALM}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:?Set TURN_SHARED_SECRET outside Git}
      TURN_URLS: ${TURN_URLS:?Set TURN_URLS}
      TURN_MIN_PORT: ${TURN_MIN_PORT:-49160}
      TURN_MAX_PORT: ${TURN_MAX_PORT:-49259}
      TURN_USER_QUOTA: ${TURN_USER_QUOTA:-20}
      TURN_TOTAL_QUOTA: ${TURN_TOTAL_QUOTA:-100}
      TURN_MAX_BPS: ${TURN_MAX_BPS:-2000000}
      TURN_BPS_CAPACITY: ${TURN_BPS_CAPACITY:-30000000}
    secrets:
      - source: turn_tls_cert
        target: turn_tls_cert.pem
      - source: turn_tls_key
        target: turn_tls_key.pem
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
      - /var/lib/coturn:size=8m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test: ['CMD', 'turnutils_stunclient', '-p', '3478', '127.0.0.1']
      interval: 20s
      timeout: 5s
      start_period: 10s
      retries: 5
    logging: *default-logging

networks:
  edge:
  backend:
    internal: true

volumes:
  caddy_data:
  caddy_config:

secrets:
  turn_tls_cert:
    file: ${TURN_TLS_CERT_FILE:?Set TURN_TLS_CERT_FILE to the TURN full-chain PEM}
  turn_tls_key:
    file: ${TURN_TLS_KEY_FILE:?Set TURN_TLS_KEY_FILE to the TURN private-key PEM}
