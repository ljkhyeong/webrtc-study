name: ${COMPOSE_PROJECT_NAME:-round}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

services:
  edge:
    image: ${ROUND_EDGE_IMAGE:?ROUND_EDGE_IMAGE를 불변 release tag 또는 digest로 설정하세요}
    build:
      context: .
      dockerfile: Dockerfile
      target: web-runtime
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22.23.0-alpine3.24@sha256:ab07539e0988b63558ff621f5fbe1077054c39d9809112974fb79993949d41cd}
        CADDY_BUILDER_IMAGE: ${CADDY_BUILDER_IMAGE:-caddy:2.11.4-builder-alpine@sha256:7bac9be4072f7c4db2ccc7350750e0705004bf02da2ac7d96b1469ca4f28bb7c}
        CADDY_IMAGE: ${CADDY_IMAGE:-caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648}
        VITE_STUN_URLS: ${VITE_STUN_URLS:?VITE_STUN_URLS를 설정하세요}
        VITE_ICE_TRANSPORT_POLICY: ${VITE_ICE_TRANSPORT_POLICY:-all}
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL을 설정하세요}
      ROUND_DOMAIN: ${ROUND_DOMAIN:?ROUND_DOMAIN을 설정하세요}
      ROUND_ACCESS_USER: ${ROUND_ACCESS_USER:?ROUND_ACCESS_USER를 설정하세요}
      ROUND_ACCESS_PASSWORD_HASH: ${ROUND_ACCESS_PASSWORD_HASH:?ROUND_ACCESS_PASSWORD_HASH를 bcrypt cost-12 hash로 설정하세요}
    ports:
      - '80:80/tcp'
      - '443:443/tcp'
      - '443:443/udp'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
      - backend
    cpus: '1.0'
    mem_limit: 256m
    pids_limit: 128
    depends_on:
      signaling:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test: ['CMD', 'wget', '-q', '-T', '2', '-O', '/dev/null', 'http://127.0.0.1:8080/healthz']
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 5
    logging: *default-logging

  signaling:
    image: ${ROUND_SIGNALING_IMAGE:?ROUND_SIGNALING_IMAGE를 불변 release tag 또는 digest로 설정하세요}
    build:
      context: .
      dockerfile: Dockerfile
      target: signaling-runtime
      args:
        JAVA_BUILD_IMAGE: ${JAVA_BUILD_IMAGE:-eclipse-temurin:21.0.11_10-jdk-alpine-3.23@sha256:1ff763083f2993d57d0bf374ab10bb3e2cb873af6c13a04458ebbd3e0337dc76}
        JAVA_RUNTIME_IMAGE: ${JAVA_RUNTIME_IMAGE:-eclipse-temurin:21.0.11_10-jre-alpine-3.23@sha256:3f08b13888f595cc49edabea7250ba69499ba25602b267da591720769400e08c}
    environment:
      HOST: 0.0.0.0
      PORT: '8787'
      SPRING_PROFILES_ACTIVE: production
      # 안전 경계: 기본 제공 edge와 Basic Auth route는 standalone 계약만 구현합니다.
      # BATON은 별도의 manifest와 edge를 사용합니다.
      ROUND_AUTH_MODE: standalone
      ROUND_STANDALONE_HOST_TOKEN_SHA256: ${ROUND_STANDALONE_HOST_TOKEN_SHA256:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS를 정확한 HTTPS origin으로 설정하세요}
      MAX_ROOM_SIZE: ${MAX_ROOM_SIZE:-6}
      MAX_SIGNALING_CONNECTIONS: ${MAX_SIGNALING_CONNECTIONS:-1000}
      MAX_SIGNALING_CONNECTIONS_PER_CLIENT: ${MAX_SIGNALING_CONNECTIONS_PER_CLIENT:-12}
      HEARTBEAT_INTERVAL_MS: ${HEARTBEAT_INTERVAL_MS:-30000}
      SIGNALING_SHUTDOWN_CLOSE_TIMEOUT_MS: ${SIGNALING_SHUTDOWN_CLOSE_TIMEOUT_MS:-5000}
      SIGNALING_ABUSE_WINDOW_MS: ${SIGNALING_ABUSE_WINDOW_MS:-10000}
      SIGNALING_MAX_FRAMES_PER_SESSION: ${SIGNALING_MAX_FRAMES_PER_SESSION:-600}
      SIGNALING_MAX_FRAMES_PER_CLIENT: ${SIGNALING_MAX_FRAMES_PER_CLIENT:-1200}
      SIGNALING_MAX_FRAMES_GLOBAL: ${SIGNALING_MAX_FRAMES_GLOBAL:-3600}
      SIGNALING_MAX_BYTES_PER_SESSION: ${SIGNALING_MAX_BYTES_PER_SESSION:-4194304}
      SIGNALING_MAX_BYTES_PER_CLIENT: ${SIGNALING_MAX_BYTES_PER_CLIENT:-8388608}
      SIGNALING_MAX_BYTES_GLOBAL: ${SIGNALING_MAX_BYTES_GLOBAL:-25165824}
      SIGNALING_MAX_OUTBOUND_QUEUE_BYTES: ${SIGNALING_MAX_OUTBOUND_QUEUE_BYTES:-2097152}
      SIGNALING_MAX_OUTBOUND_QUEUE_BYTES_GLOBAL: ${SIGNALING_MAX_OUTBOUND_QUEUE_BYTES_GLOBAL:-67108864}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError
      TURN_PROVIDER: ${TURN_PROVIDER:-cloudflare}
      TURN_CLOUDFLARE_KEY_ID: ${TURN_CLOUDFLARE_KEY_ID:?Cloudflare TURN key ID를 설정하세요}
      TURN_CLOUDFLARE_API_TOKEN: ${TURN_CLOUDFLARE_API_TOKEN:?Cloudflare TURN API token을 Git 외부에서 설정하세요}
      TURN_CREDENTIAL_TTL_SECONDS: ${TURN_CREDENTIAL_TTL_SECONDS:-600}
      TURN_CREDENTIAL_RATE_LIMIT_WINDOW_SECONDS: ${TURN_CREDENTIAL_RATE_LIMIT_WINDOW_SECONDS:-600}
      TURN_CREDENTIAL_RATE_LIMIT_MAX_REQUESTS: ${TURN_CREDENTIAL_RATE_LIMIT_MAX_REQUESTS:-12}
      TURN_CREDENTIAL_RATE_LIMIT_PARTICIPANT_MAX_REQUESTS: ${TURN_CREDENTIAL_RATE_LIMIT_PARTICIPANT_MAX_REQUESTS:-6}
      TURN_CREDENTIAL_RATE_LIMIT_GLOBAL_MAX_REQUESTS: ${TURN_CREDENTIAL_RATE_LIMIT_GLOBAL_MAX_REQUESTS:-24}
      TURN_CREDENTIAL_RATE_LIMIT_MAX_CLIENTS: ${TURN_CREDENTIAL_RATE_LIMIT_MAX_CLIENTS:-10000}
      TURN_CREDENTIAL_RATE_LIMIT_MAX_PARTICIPANTS: ${TURN_CREDENTIAL_RATE_LIMIT_MAX_PARTICIPANTS:-10000}
    expose:
      - '8787'
    networks:
      - backend
      - egress
    deploy:
      replicas: 1
    mem_limit: 512m
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ['CMD', 'wget', '-q', '-T', '2', '-O', '/dev/null', 'http://127.0.0.1:8787/healthz']
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 5
    logging: *default-logging

networks:
  edge:
  backend:
    internal: true
  egress:

volumes:
  caddy_data:
  caddy_config:
