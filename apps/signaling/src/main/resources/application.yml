server:
  address: ${HOST:0.0.0.0}
  port: ${PORT:8787}
  forward-headers-strategy: native
  shutdown: graceful

spring:
  http:
    clients:
      connect-timeout: 3s
      read-timeout: 5s
  lifecycle:
    timeout-per-shutdown-phase: 10s

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,signaling
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: round-signaling

round:
  auth:
    mode: ${ROUND_AUTH_MODE:standalone}
    cookie-name: ${ROUND_AUTH_COOKIE_NAME:__Secure-round_access}
    issuer: ${ROUND_AUTH_ISSUER:}
    audience: ${ROUND_AUTH_AUDIENCE:round}
    jwk-set-uri: ${ROUND_AUTH_JWK_SET_URI:}
    standalone-host-token-sha256: ${ROUND_STANDALONE_HOST_TOKEN_SHA256:}
    max-grant-lifetime: ${ROUND_AUTH_MAX_GRANT_LIFETIME_SECONDS:300}s
  signaling:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
    max-room-size: ${MAX_ROOM_SIZE:6}
    max-connections: ${MAX_SIGNALING_CONNECTIONS:1000}
    max-connections-per-client: ${MAX_SIGNALING_CONNECTIONS_PER_CLIENT:12}
    heartbeat-interval: ${HEARTBEAT_INTERVAL_MS:30000}ms
    unjoined-timeout: ${UNJOINED_SOCKET_TIMEOUT_MS:15000}ms
    unjoined-sweep-interval: ${UNJOINED_SOCKET_SWEEP_MS:1000}ms
    shutdown-close-timeout: ${SIGNALING_SHUTDOWN_CLOSE_TIMEOUT_MS:5000}ms
    abuse-window: ${SIGNALING_ABUSE_WINDOW_MS:10000}ms
    max-frames-per-session-window: ${SIGNALING_MAX_FRAMES_PER_SESSION:600}
    max-frames-per-client-window: ${SIGNALING_MAX_FRAMES_PER_CLIENT:1200}
    max-frames-global-window: ${SIGNALING_MAX_FRAMES_GLOBAL:3600}
    max-bytes-per-session-window: ${SIGNALING_MAX_BYTES_PER_SESSION:4194304}
    max-bytes-per-client-window: ${SIGNALING_MAX_BYTES_PER_CLIENT:8388608}
    max-bytes-global-window: ${SIGNALING_MAX_BYTES_GLOBAL:25165824}
    max-outbound-queue-bytes: ${SIGNALING_MAX_OUTBOUND_QUEUE_BYTES:2097152}
    max-outbound-queue-bytes-global: ${SIGNALING_MAX_OUTBOUND_QUEUE_BYTES_GLOBAL:67108864}
  turn:
    provider: ${TURN_PROVIDER:disabled}
    cloudflare-key-id: ${TURN_CLOUDFLARE_KEY_ID:}
    cloudflare-api-token: ${TURN_CLOUDFLARE_API_TOKEN:}
    credential-ttl: ${TURN_CREDENTIAL_TTL_SECONDS:600}s
    rate-limit-window: ${TURN_CREDENTIAL_RATE_LIMIT_WINDOW_SECONDS:600}s
    rate-limit-max-requests: ${TURN_CREDENTIAL_RATE_LIMIT_MAX_REQUESTS:12}
    rate-limit-participant-max-requests: ${TURN_CREDENTIAL_RATE_LIMIT_PARTICIPANT_MAX_REQUESTS:6}
    rate-limit-global-max-requests: ${TURN_CREDENTIAL_RATE_LIMIT_GLOBAL_MAX_REQUESTS:24}
    rate-limit-max-clients: ${TURN_CREDENTIAL_RATE_LIMIT_MAX_CLIENTS:10000}
    rate-limit-max-participants: ${TURN_CREDENTIAL_RATE_LIMIT_MAX_PARTICIPANTS:10000}
