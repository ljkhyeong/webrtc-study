name: 실제 iOS Safari 검사

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browserstack-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-safari:
    name: BrowserStack 실제 iOS Safari
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}

    steps:
      - name: BrowserStack 자격 증명 확인
        id: credentials
        shell: bash
        run: |
          if [[ -n "$BROWSERSTACK_USERNAME" && -n "$BROWSERSTACK_ACCESS_KEY" ]]; then
            echo 'enabled=true' >>"$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >>"$GITHUB_OUTPUT"
            echo '::notice::BrowserStack 저장소 secret이 없어 실제 iOS Safari 검사를 건너뜁니다.'
          fi

      - name: 저장소 checkout
        if: steps.credentials.outputs.enabled == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Node.js 설정
        if: steps.credentials.outputs.enabled == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: npm 11 설정
        if: steps.credentials.outputs.enabled == 'true'
        run: npm install --global npm@11.7.0 --no-audit --no-fund

      - name: Java 설정
        if: steps.credentials.outputs.enabled == 'true'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: 의존성 설치
        if: steps.credentials.outputs.enabled == 'true'
        run: npm ci

      - name: 실제 iOS Safari 화면 및 입장 흐름 검사
        if: steps.credentials.outputs.enabled == 'true'
        run: npm run test:e2e:ios-safari
