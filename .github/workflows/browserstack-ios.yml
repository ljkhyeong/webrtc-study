name: 실제 iOS Safari 검사

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browserstack-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-safari:
    name: BrowserStack 실제 iOS Safari
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: BrowserStack 자격 증명 확인
        shell: bash
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          if [[ -z "$BROWSERSTACK_USERNAME" || -z "$BROWSERSTACK_ACCESS_KEY" ]]; then
            echo '::error::BrowserStack 저장소 secret 두 개가 모두 필요합니다.'
            exit 1
          fi

      - name: 저장소 checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.js 설정
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: npm 11 설정
        run: npm install --global npm@11.7.0 --no-audit --no-fund

      - name: Java 설정
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: 의존성 설치
        run: npm ci

      - name: 실제 iOS Safari 화면 및 입장 흐름 검사
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: npm run test:e2e:ios-safari
