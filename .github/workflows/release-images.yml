name: 컨테이너 이미지 릴리스

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-images-${{ github.repository }}
  cancel-in-progress: false
  queue: max

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}

jobs:
  preflight:
    name: 불변 릴리스 입력 검증
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      stun_urls: ${{ steps.release-inputs.outputs.stun_urls }}
      tag_object: ${{ steps.release-inputs.outputs.tag_object }}

    steps:
      - name: 저장소와 태그 체크아웃
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: 릴리스 태그와 포함 입력 검증
        id: release-inputs
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TAG_PUSH_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail

          if [[ "$TAG_PUSH_FORCED" == 'true' ]]; then
            printf '릴리스 태그 강제 갱신은 게시할 수 없습니다.\n' >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            printf '릴리스 태그는 build metadata가 없는 SemVer를 사용해야 합니다. 예: v0.1.0 또는 v0.1.0-rc.1\n' >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease="${RELEASE_TAG#*-}"
            IFS='.' read -r -a prerelease_identifiers <<< "$prerelease"
            for identifier in "${prerelease_identifiers[@]}"; do
              if [[ "$identifier" =~ ^[0-9]+$ && "$identifier" == 0[0-9]* ]]; then
                printf '숫자형 SemVer prerelease 식별자에는 앞쪽 0을 사용할 수 없습니다: %s\n' \
                  "$identifier" >&2
                exit 1
              fi
            done
          fi

          tag_ref="refs/tags/${RELEASE_TAG}"
          if ! tag_type="$(git cat-file -t "$tag_ref" 2>/dev/null)"; then
            printf '가져온 저장소에 릴리스 태그 %s가 없습니다.\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          if [[ "$tag_type" != 'tag' ]]; then
            printf '릴리스 태그 %s는 annotated tag여야 합니다.\n' "$RELEASE_TAG" >&2
            exit 1
          fi

          tag_object="$(git rev-parse "$tag_ref")"
          tag_commit="$(git rev-parse "${tag_ref}^{commit}")"
          if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
            printf '릴리스 태그 %s가 이벤트 커밋 %s가 아니라 %s를 가리킵니다.\n' \
              "$RELEASE_TAG" "$GITHUB_SHA" "$tag_commit" >&2
            exit 1
          fi

          tag_contents="$(git for-each-ref --format='%(contents)' "$tag_ref")"
          stun_line_count="$(
            printf '%s\n' "$tag_contents" |
              awk '/^ROUND_STUN_URLS=/{count++} END{print count+0}'
          )"
          if [[ "$stun_line_count" != '1' ]]; then
            printf 'annotated tag 메시지에는 ROUND_STUN_URLS=<쉼표로 구분한 STUN URI> 행이 정확히 하나 있어야 합니다.\n' >&2
            exit 1
          fi

          stun_urls="$(
            printf '%s\n' "$tag_contents" |
              sed -n 's/^ROUND_STUN_URLS=//p'
          )"
          if [[ -z "$stun_urls" || "$stun_urls" =~ [[:space:]] ]]; then
            printf 'ROUND_STUN_URLS는 비어 있지 않아야 하며 공백을 포함할 수 없습니다.\n' >&2
            exit 1
          fi
          if [[ "$stun_urls" == ,* || "$stun_urls" == *, || "$stun_urls" == *,,* ]]; then
            printf 'ROUND_STUN_URLS에는 쉼표로 구분된 빈 항목이 있을 수 없습니다.\n' >&2
            exit 1
          fi

          IFS=',' read -r -a stun_entries <<< "$stun_urls"
          for stun_url in "${stun_entries[@]}"; do
            if [[ ! "$stun_url" =~ ^stuns?:[^,[:space:]]+$ ]]; then
              printf '릴리스 태그에 잘못된 STUN URI가 있습니다: %s\n' "$stun_url" >&2
              exit 1
            fi
          done

          printf 'stun_urls=%s\n' "$stun_urls" >> "$GITHUB_OUTPUT"
          printf 'tag_object=%s\n' "$tag_object" >> "$GITHUB_OUTPUT"

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: GitHub Container Registry 로그인
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 모든 최종 태그가 미사용 상태인지 확인
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          assert_tag_absent() {
            local reference="$1"
            local inspect_output

            if inspect_output="$(docker buildx imagetools inspect "$reference" 2>&1)"; then
              printf '기존 이미지 태그를 덮어쓰지 않습니다: %s\n' "$reference" >&2
              return 1
            fi
            if grep -Eqi '(manifest unknown|name unknown|(^|: )not found([[:space:]]|$))' <<< "$inspect_output"; then
              printf '미사용 이미지 태그를 확인했습니다: %s\n' "$reference"
              return 0
            fi

            printf '이미지 태그가 미사용 상태임을 증명하지 못했습니다: %s\n%s\n' \
              "$reference" "$inspect_output" >&2
            return 1
          }

          references=(
            "${IMAGE_NAMESPACE}/round-edge:${RELEASE_TAG}"
            "${IMAGE_NAMESPACE}/round-edge:sha-${RELEASE_SHA}"
            "${IMAGE_NAMESPACE}/round-edge:${RELEASE_TAG}-relay"
            "${IMAGE_NAMESPACE}/round-edge:sha-${RELEASE_SHA}-relay"
            "${IMAGE_NAMESPACE}/round-baton-web:${RELEASE_TAG}"
            "${IMAGE_NAMESPACE}/round-baton-web:sha-${RELEASE_SHA}"
            "${IMAGE_NAMESPACE}/round-signaling:${RELEASE_TAG}"
            "${IMAGE_NAMESPACE}/round-signaling:sha-${RELEASE_SHA}"
            "${IMAGE_NAMESPACE}/round-turn:${RELEASE_TAG}"
            "${IMAGE_NAMESPACE}/round-turn:sha-${RELEASE_SHA}"
          )
          for reference in "${references[@]}"; do
            assert_tag_absent "$reference"
          done

  verify:
    name: 릴리스 후보 검증
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Node.js 설정
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Java 설정
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: 의존성 설치
        run: npm ci

      - name: 저장소 검사 실행
        run: npm run check

      - name: 배포 설정 검증
        run: bash ops/ci/validate-deployment.sh --check-only

  build-edge:
    name: 웹 edge 이미지 digest build
    needs:
      - preflight
      - verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      edge_digest: ${{ steps.edge.outputs.digest }}
      relay_digest: ${{ steps.edge-relay.outputs.digest }}
      baton_web_digest: ${{ steps.baton-web.outputs.digest }}

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: QEMU 설정
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: GitHub Container Registry 로그인
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 프로덕션 edge digest build 및 push
        id: edge
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: web-runtime
          platforms: linux/amd64,linux/arm64
          pull: true
          build-args: |
            VITE_STUN_URLS=${{ needs.preflight.outputs.stun_urls }}
            VITE_ICE_TRANSPORT_POLICY=all
          outputs: type=image,name=${{ env.IMAGE_NAMESPACE }}/round-edge,push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            io.round.image.role=edge
            io.round.image.flavor=standalone
            io.round.release.tag-object=${{ needs.preflight.outputs.tag_object }}
          cache-from: type=gha,scope=round-edge
          cache-to: type=gha,mode=max,scope=round-edge
          provenance: mode=max
          sbom: true

      - name: 독립 실행 edge 이미지의 서명된 출처 증명 발행
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ env.IMAGE_NAMESPACE }}/round-edge
          subject-digest: ${{ steps.edge.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: 릴레이 전용 edge digest build 및 push
        id: edge-relay
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: web-runtime
          platforms: linux/amd64,linux/arm64
          pull: true
          build-args: |
            VITE_STUN_URLS=${{ needs.preflight.outputs.stun_urls }}
            VITE_ICE_TRANSPORT_POLICY=relay
          outputs: type=image,name=${{ env.IMAGE_NAMESPACE }}/round-edge,push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}-relay
            io.round.image.role=edge
            io.round.image.flavor=relay
            io.round.release.tag-object=${{ needs.preflight.outputs.tag_object }}
          cache-from: type=gha,scope=round-edge-relay
          cache-to: type=gha,mode=max,scope=round-edge-relay
          provenance: mode=max
          sbom: true

      - name: 릴레이 전용 edge 이미지의 서명된 출처 증명 발행
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ env.IMAGE_NAMESPACE }}/round-edge
          subject-digest: ${{ steps.edge-relay.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: BATON web digest build 및 push
        id: baton-web
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: baton-web-runtime
          platforms: linux/amd64,linux/arm64
          pull: true
          build-args: |
            VITE_STUN_URLS=${{ needs.preflight.outputs.stun_urls }}
            VITE_ICE_TRANSPORT_POLICY=all
          outputs: type=image,name=${{ env.IMAGE_NAMESPACE }}/round-baton-web,push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            io.round.auth-mode=baton
            io.round.image.role=edge
            io.round.image.flavor=baton
            io.round.release.tag-object=${{ needs.preflight.outputs.tag_object }}
          cache-from: type=gha,scope=round-baton-web
          cache-to: type=gha,mode=max,scope=round-baton-web
          provenance: mode=max
          sbom: true

      - name: BATON web 이미지의 서명된 출처 증명 발행
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ env.IMAGE_NAMESPACE }}/round-baton-web
          subject-digest: ${{ steps.baton-web.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  build-signaling:
    name: 시그널링 이미지 digest build
    needs:
      - preflight
      - verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: QEMU 설정
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: GitHub Container Registry 로그인
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 시그널링 digest build 및 push
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: signaling-runtime
          platforms: linux/amd64,linux/arm64
          pull: true
          outputs: type=image,name=${{ env.IMAGE_NAMESPACE }}/round-signaling,push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            io.round.image.role=signaling
            io.round.image.flavor=shared
            io.round.release.tag-object=${{ needs.preflight.outputs.tag_object }}
          cache-from: type=gha,scope=round-signaling
          cache-to: type=gha,mode=max,scope=round-signaling
          provenance: mode=max
          sbom: true

      - name: 시그널링 이미지의 서명된 출처 증명 발행
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ env.IMAGE_NAMESPACE }}/round-signaling
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  build-turn:
    name: TURN 이미지 digest build
    needs:
      - preflight
      - verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: QEMU 설정
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: GitHub Container Registry 로그인
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: TURN digest build 및 push
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: turn-runtime
          platforms: linux/amd64,linux/arm64
          pull: true
          outputs: type=image,name=${{ env.IMAGE_NAMESPACE }}/round-turn,push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            io.round.image.role=turn
            io.round.image.flavor=shared
            io.round.release.tag-object=${{ needs.preflight.outputs.tag_object }}
          cache-from: type=gha,scope=round-turn
          cache-to: type=gha,mode=max,scope=round-turn
          provenance: mode=max
          sbom: true

      - name: TURN 이미지의 서명된 출처 증명 발행
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ env.IMAGE_NAMESPACE }}/round-turn
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  promote:
    name: 검증된 이미지 digest 승격
    needs:
      - preflight
      - build-edge
      - build-signaling
      - build-turn
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: 저장소와 태그 체크아웃
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: 릴리스 태그 객체 불변성 확인
        shell: bash
        env:
          EXPECTED_TAG_OBJECT: ${{ needs.preflight.outputs.tag_object }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          tag_ref="refs/tags/${RELEASE_TAG}"
          if ! current_tag_object="$(git rev-parse "$tag_ref" 2>/dev/null)"; then
            printf '승격 전에 릴리스 태그 %s가 사라졌습니다.\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          if [[ "$current_tag_object" != "$EXPECTED_TAG_OBJECT" ]]; then
            printf '승격 전에 릴리스 태그 객체가 변경되었습니다. 예상값 %s, 실제값 %s.\n' \
              "$EXPECTED_TAG_OBJECT" "$current_tag_object" >&2
            exit 1
          fi

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: GitHub Container Registry 로그인
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 태그 재확인 및 원본 digest 검증
        shell: bash
        env:
          BATON_WEB_DIGEST: ${{ needs.build-edge.outputs.baton_web_digest }}
          EDGE_DIGEST: ${{ needs.build-edge.outputs.edge_digest }}
          RELAY_DIGEST: ${{ needs.build-edge.outputs.relay_digest }}
          SIGNALING_DIGEST: ${{ needs.build-signaling.outputs.digest }}
          TURN_DIGEST: ${{ needs.build-turn.outputs.digest }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          assert_tag_absent() {
            local reference="$1"
            local inspect_output

            if inspect_output="$(docker buildx imagetools inspect "$reference" 2>&1)"; then
              printf '기존 이미지 태그를 덮어쓰지 않습니다: %s\n' "$reference" >&2
              return 1
            fi
            if grep -Eqi '(manifest unknown|name unknown|(^|: )not found([[:space:]]|$))' <<< "$inspect_output"; then
              return 0
            fi

            printf '이미지 태그가 미사용 상태임을 증명하지 못했습니다: %s\n%s\n' \
              "$reference" "$inspect_output" >&2
            return 1
          }

          references=(
            "${IMAGE_NAMESPACE}/round-edge:${RELEASE_TAG}"
            "${IMAGE_NAMESPACE}/round-edge:sha-${RELEASE_SHA}"
            "${IMAGE_NAMESPACE}/round-edge:${RELEASE_TAG}-relay"
            "${IMAGE_NAMESPACE}/round-edge:sha-${RELEASE_SHA}-relay"
            "${IMAGE_NAMESPACE}/round-baton-web:${RELEASE_TAG}"
            "${IMAGE_NAMESPACE}/round-baton-web:sha-${RELEASE_SHA}"
            "${IMAGE_NAMESPACE}/round-signaling:${RELEASE_TAG}"
            "${IMAGE_NAMESPACE}/round-signaling:sha-${RELEASE_SHA}"
            "${IMAGE_NAMESPACE}/round-turn:${RELEASE_TAG}"
            "${IMAGE_NAMESPACE}/round-turn:sha-${RELEASE_SHA}"
          )
          for reference in "${references[@]}"; do
            assert_tag_absent "$reference"
          done

          digest_sources=(
            "${IMAGE_NAMESPACE}/round-edge@${EDGE_DIGEST}"
            "${IMAGE_NAMESPACE}/round-edge@${RELAY_DIGEST}"
            "${IMAGE_NAMESPACE}/round-baton-web@${BATON_WEB_DIGEST}"
            "${IMAGE_NAMESPACE}/round-signaling@${SIGNALING_DIGEST}"
            "${IMAGE_NAMESPACE}/round-turn@${TURN_DIGEST}"
          )
          for source in "${digest_sources[@]}"; do
            digest="${source##*@}"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              printf '잘못된 build digest입니다: %s\n' "$source" >&2
              exit 1
            fi
            docker buildx imagetools inspect "$source" >/dev/null
          done

      - name: 모든 이미지 digest를 최종 태그로 승격
        shell: bash
        env:
          BATON_WEB_DIGEST: ${{ needs.build-edge.outputs.baton_web_digest }}
          EDGE_DIGEST: ${{ needs.build-edge.outputs.edge_digest }}
          RELAY_DIGEST: ${{ needs.build-edge.outputs.relay_digest }}
          SIGNALING_DIGEST: ${{ needs.build-signaling.outputs.digest }}
          TURN_DIGEST: ${{ needs.build-turn.outputs.digest }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          docker buildx imagetools create \
            --tag "${IMAGE_NAMESPACE}/round-baton-web:${RELEASE_TAG}" \
            --tag "${IMAGE_NAMESPACE}/round-baton-web:sha-${RELEASE_SHA}" \
            "${IMAGE_NAMESPACE}/round-baton-web@${BATON_WEB_DIGEST}"
          docker buildx imagetools create \
            --tag "${IMAGE_NAMESPACE}/round-signaling:${RELEASE_TAG}" \
            --tag "${IMAGE_NAMESPACE}/round-signaling:sha-${RELEASE_SHA}" \
            "${IMAGE_NAMESPACE}/round-signaling@${SIGNALING_DIGEST}"
          docker buildx imagetools create \
            --tag "${IMAGE_NAMESPACE}/round-turn:${RELEASE_TAG}" \
            --tag "${IMAGE_NAMESPACE}/round-turn:sha-${RELEASE_SHA}" \
            "${IMAGE_NAMESPACE}/round-turn@${TURN_DIGEST}"
          docker buildx imagetools create \
            --tag "${IMAGE_NAMESPACE}/round-edge:${RELEASE_TAG}-relay" \
            --tag "${IMAGE_NAMESPACE}/round-edge:sha-${RELEASE_SHA}-relay" \
            "${IMAGE_NAMESPACE}/round-edge@${RELAY_DIGEST}"
          docker buildx imagetools create \
            --tag "${IMAGE_NAMESPACE}/round-edge:${RELEASE_TAG}" \
            --tag "${IMAGE_NAMESPACE}/round-edge:sha-${RELEASE_SHA}" \
            "${IMAGE_NAMESPACE}/round-edge@${EDGE_DIGEST}"

      - name: 승격된 모든 태그 digest 검증
        shell: bash
        env:
          BATON_WEB_DIGEST: ${{ needs.build-edge.outputs.baton_web_digest }}
          EDGE_DIGEST: ${{ needs.build-edge.outputs.edge_digest }}
          RELAY_DIGEST: ${{ needs.build-edge.outputs.relay_digest }}
          SIGNALING_DIGEST: ${{ needs.build-signaling.outputs.digest }}
          TURN_DIGEST: ${{ needs.build-turn.outputs.digest }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          verify_tag_digest() {
            local reference="$1"
            local expected_digest="$2"
            local actual_digest

            actual_digest="$(
              docker buildx imagetools inspect "$reference" \
                --format '{{json .Manifest.Digest}}'
            )"
            actual_digest="${actual_digest#\"}"
            actual_digest="${actual_digest%\"}"
            if [[ "$actual_digest" != "$expected_digest" ]]; then
              printf '승격된 태그 %s의 실제 digest는 %s이며 예상값은 %s입니다.\n' \
                "$reference" "$actual_digest" "$expected_digest" >&2
              return 1
            fi
          }

          verify_tag_digest "${IMAGE_NAMESPACE}/round-edge:${RELEASE_TAG}" "$EDGE_DIGEST"
          verify_tag_digest "${IMAGE_NAMESPACE}/round-edge:sha-${RELEASE_SHA}" "$EDGE_DIGEST"
          verify_tag_digest "${IMAGE_NAMESPACE}/round-edge:${RELEASE_TAG}-relay" "$RELAY_DIGEST"
          verify_tag_digest "${IMAGE_NAMESPACE}/round-edge:sha-${RELEASE_SHA}-relay" "$RELAY_DIGEST"
          verify_tag_digest "${IMAGE_NAMESPACE}/round-baton-web:${RELEASE_TAG}" "$BATON_WEB_DIGEST"
          verify_tag_digest "${IMAGE_NAMESPACE}/round-baton-web:sha-${RELEASE_SHA}" "$BATON_WEB_DIGEST"
          verify_tag_digest "${IMAGE_NAMESPACE}/round-signaling:${RELEASE_TAG}" "$SIGNALING_DIGEST"
          verify_tag_digest "${IMAGE_NAMESPACE}/round-signaling:sha-${RELEASE_SHA}" "$SIGNALING_DIGEST"
          verify_tag_digest "${IMAGE_NAMESPACE}/round-turn:${RELEASE_TAG}" "$TURN_DIGEST"
          verify_tag_digest "${IMAGE_NAMESPACE}/round-turn:sha-${RELEASE_SHA}" "$TURN_DIGEST"

      - name: 승격된 이미지 digest 기록
        shell: bash
        env:
          BATON_WEB_DIGEST: ${{ needs.build-edge.outputs.baton_web_digest }}
          EDGE_DIGEST: ${{ needs.build-edge.outputs.edge_digest }}
          RELAY_DIGEST: ${{ needs.build-edge.outputs.relay_digest }}
          SIGNALING_DIGEST: ${{ needs.build-signaling.outputs.digest }}
          TURN_DIGEST: ${{ needs.build-turn.outputs.digest }}
        run: |
          {
            printf '### 승격된 ROUND 이미지\n\n'
            printf -- '- 프로덕션 edge: `%s/round-edge@%s`\n' "$IMAGE_NAMESPACE" "$EDGE_DIGEST"
            printf -- '- 릴레이 전용 edge: `%s/round-edge@%s`\n' "$IMAGE_NAMESPACE" "$RELAY_DIGEST"
            printf -- '- BATON web: `%s/round-baton-web@%s`\n' "$IMAGE_NAMESPACE" "$BATON_WEB_DIGEST"
            printf -- '- 시그널링: `%s/round-signaling@%s`\n' "$IMAGE_NAMESPACE" "$SIGNALING_DIGEST"
            printf -- '- TURN: `%s/round-turn@%s`\n' "$IMAGE_NAMESPACE" "$TURN_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
