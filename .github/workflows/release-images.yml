name: 컨테이너 이미지 릴리스

on:
  repository_dispatch:
    types:
      - release-images

permissions:
  contents: read

concurrency:
  group: release-images-${{ github.repository }}
  cancel-in-progress: false
  queue: max

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}

jobs:
  preflight:
    name: 불변 릴리스 입력 검증
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      packages: read
    outputs:
      release_sha: ${{ steps.release-inputs.outputs.release_sha }}
      release_tag: ${{ steps.release-inputs.outputs.release_tag }}
      stun_urls: ${{ steps.release-inputs.outputs.stun_urls }}
      tag_object: ${{ steps.release-inputs.outputs.tag_object }}

    steps:
      - name: 저장소와 태그 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: 릴리스 태그와 포함 입력 검증
        id: release-inputs
        shell: bash
        env:
          COORDINATOR_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.client_payload.release_tag }}
        run: |
          set -euo pipefail

          [[ "$COORDINATOR_REF" == "refs/heads/${DEFAULT_BRANCH}" ]] || {
            printf '릴리스 coordinator는 기본 브랜치에서만 실행할 수 있습니다.\n' >&2
            exit 1
          }
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            printf '릴리스 태그는 build metadata가 없는 SemVer를 사용해야 합니다. 예: v0.1.0 또는 v0.1.0-rc.1\n' >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease="${RELEASE_TAG#*-}"
            IFS='.' read -r -a prerelease_identifiers <<< "$prerelease"
            for identifier in "${prerelease_identifiers[@]}"; do
              if [[ "$identifier" =~ ^[0-9]+$ && "$identifier" == 0[0-9]* ]]; then
                printf '숫자형 SemVer prerelease 식별자에는 앞쪽 0을 사용할 수 없습니다: %s\n' \
                  "$identifier" >&2
                exit 1
              fi
            done
          fi

          tag_ref="refs/tags/${RELEASE_TAG}"
          if ! tag_object="$(git rev-parse "${tag_ref}^{tag}" 2>/dev/null)"; then
            printf '가져온 릴리스 태그 %s는 존재하는 annotated tag여야 합니다.\n' \
              "$RELEASE_TAG" >&2
            exit 1
          fi

          tag_commit="$(git rev-parse "${tag_ref}^{commit}")"
          if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
            printf '릴리스 태그 %s는 repository_dispatch 시점의 기본 브랜치 HEAD %s를 가리켜야 하지만 %s를 가리킵니다.\n' \
              "$RELEASE_TAG" "$GITHUB_SHA" "$tag_commit" >&2
            exit 1
          fi

          ci_runs="$(
            gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f "head_sha=${tag_commit}" \
              -f "branch=${DEFAULT_BRANCH}" \
              -f event=push \
              -f status=completed \
              -f per_page=100
          )"
          if ! jq -e \
              --arg branch "$DEFAULT_BRANCH" \
              --arg sha "$tag_commit" \
              'any(.workflow_runs[];
                  .head_branch == $branch
                    and .head_sha == $sha
                    and .event == "push"
                    and .conclusion == "success"
                    and .path == ".github/workflows/ci.yml")' \
              <<<"$ci_runs" >/dev/null; then
            printf '기본 브랜치의 릴리스 SHA %s에 성공한 CI push run이 없습니다.\n' \
              "$tag_commit" >&2
            exit 1
          fi

          tag_contents="$(git for-each-ref --format='%(contents)' "$tag_ref")"
          stun_line_count="$(
            printf '%s\n' "$tag_contents" |
              awk '/^ROUND_STUN_URLS=/{count++} END{print count+0}'
          )"
          if [[ "$stun_line_count" != '1' ]]; then
            printf 'annotated tag 메시지에는 ROUND_STUN_URLS=<쉼표로 구분한 STUN URI> 행이 정확히 하나 있어야 합니다.\n' >&2
            exit 1
          fi

          stun_urls="$(
            printf '%s\n' "$tag_contents" |
              sed -n 's/^ROUND_STUN_URLS=//p'
          )"
          if [[ -z "$stun_urls" || "$stun_urls" =~ [[:space:]] ]]; then
            printf 'ROUND_STUN_URLS는 비어 있지 않아야 하며 공백을 포함할 수 없습니다.\n' >&2
            exit 1
          fi
          if [[ "$stun_urls" == ,* || "$stun_urls" == *, || "$stun_urls" == *,,* ]]; then
            printf 'ROUND_STUN_URLS에는 쉼표로 구분된 빈 항목이 있을 수 없습니다.\n' >&2
            exit 1
          fi

          IFS=',' read -r -a stun_entries <<< "$stun_urls"
          for stun_url in "${stun_entries[@]}"; do
            if [[ ! "$stun_url" =~ ^stuns?:[^,[:space:]]+$ ]]; then
              printf '릴리스 태그에 잘못된 STUN URI가 있습니다: %s\n' "$stun_url" >&2
              exit 1
            fi
          done

          printf 'stun_urls=%s\n' "$stun_urls" >> "$GITHUB_OUTPUT"
          printf 'tag_object=%s\n' "$tag_object" >> "$GITHUB_OUTPUT"
          printf 'release_sha=%s\n' "$tag_commit" >> "$GITHUB_OUTPUT"
          printf 'release_tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: GitHub Container Registry 로그인
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 모든 최종 태그가 미사용 상태인지 확인
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release-inputs.outputs.release_tag }}
          RELEASE_SHA: ${{ steps.release-inputs.outputs.release_sha }}
        run: |
          set -euo pipefail

          references=(
            "${IMAGE_NAMESPACE}/round-edge:${RELEASE_TAG}"
            "${IMAGE_NAMESPACE}/round-edge:sha-${RELEASE_SHA}"
            "${IMAGE_NAMESPACE}/round-edge:${RELEASE_TAG}-relay"
            "${IMAGE_NAMESPACE}/round-edge:sha-${RELEASE_SHA}-relay"
            "${IMAGE_NAMESPACE}/round-baton-web:${RELEASE_TAG}"
            "${IMAGE_NAMESPACE}/round-baton-web:sha-${RELEASE_SHA}"
            "${IMAGE_NAMESPACE}/round-signaling:${RELEASE_TAG}"
            "${IMAGE_NAMESPACE}/round-signaling:sha-${RELEASE_SHA}"
          )
          bash ops/ci/assert-image-tags-absent.sh "${references[@]}"

  build-edge:
    name: 웹 edge 이미지 digest build
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      edge_digest: ${{ steps.edge.outputs.digest }}
      relay_digest: ${{ steps.edge-relay.outputs.digest }}
      baton_web_digest: ${{ steps.baton-web.outputs.digest }}

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}
          persist-credentials: false

      - name: QEMU 설정
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: GitHub Container Registry 로그인
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 프로덕션 edge digest build 및 push
        id: edge
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: web-runtime
          platforms: linux/amd64,linux/arm64
          pull: true
          build-args: |
            VITE_STUN_URLS=${{ needs.preflight.outputs.stun_urls }}
            VITE_ICE_TRANSPORT_POLICY=all
          outputs: type=image,name=${{ env.IMAGE_NAMESPACE }}/round-edge,push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.preflight.outputs.release_sha }}
            org.opencontainers.image.version=${{ needs.preflight.outputs.release_tag }}
            io.round.image.role=edge
            io.round.image.flavor=standalone
            io.round.release.tag-object=${{ needs.preflight.outputs.tag_object }}
          cache-from: type=gha,scope=round-edge
          cache-to: type=gha,mode=max,scope=round-edge
          provenance: mode=max
          sbom: true

      - name: 독립 실행 edge 이미지의 서명된 출처 증명 발행
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAMESPACE }}/round-edge
          subject-digest: ${{ steps.edge.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: 릴레이 전용 edge digest build 및 push
        id: edge-relay
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: web-runtime
          platforms: linux/amd64,linux/arm64
          pull: true
          build-args: |
            VITE_STUN_URLS=${{ needs.preflight.outputs.stun_urls }}
            VITE_ICE_TRANSPORT_POLICY=relay
          outputs: type=image,name=${{ env.IMAGE_NAMESPACE }}/round-edge,push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.preflight.outputs.release_sha }}
            org.opencontainers.image.version=${{ needs.preflight.outputs.release_tag }}-relay
            io.round.image.role=edge
            io.round.image.flavor=relay
            io.round.release.tag-object=${{ needs.preflight.outputs.tag_object }}
          cache-from: type=gha,scope=round-edge-relay
          cache-to: type=gha,mode=max,scope=round-edge-relay
          provenance: mode=max
          sbom: true

      - name: 릴레이 전용 edge 이미지의 서명된 출처 증명 발행
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAMESPACE }}/round-edge
          subject-digest: ${{ steps.edge-relay.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: BATON web digest build 및 push
        id: baton-web
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: baton-web-runtime
          platforms: linux/amd64,linux/arm64
          pull: true
          build-args: |
            VITE_STUN_URLS=${{ needs.preflight.outputs.stun_urls }}
            VITE_ICE_TRANSPORT_POLICY=all
          outputs: type=image,name=${{ env.IMAGE_NAMESPACE }}/round-baton-web,push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.preflight.outputs.release_sha }}
            org.opencontainers.image.version=${{ needs.preflight.outputs.release_tag }}
            io.round.auth-mode=baton
            io.round.image.role=edge
            io.round.image.flavor=baton
            io.round.release.tag-object=${{ needs.preflight.outputs.tag_object }}
          cache-from: type=gha,scope=round-baton-web
          cache-to: type=gha,mode=max,scope=round-baton-web
          provenance: mode=max
          sbom: true

      - name: BATON web 이미지의 서명된 출처 증명 발행
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAMESPACE }}/round-baton-web
          subject-digest: ${{ steps.baton-web.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  build-signaling:
    name: 시그널링 이미지 digest build
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}
          persist-credentials: false

      - name: QEMU 설정
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: GitHub Container Registry 로그인
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 시그널링 digest build 및 push
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: signaling-runtime
          platforms: linux/amd64,linux/arm64
          pull: true
          outputs: type=image,name=${{ env.IMAGE_NAMESPACE }}/round-signaling,push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.preflight.outputs.release_sha }}
            org.opencontainers.image.version=${{ needs.preflight.outputs.release_tag }}
            io.round.image.role=signaling
            io.round.image.flavor=shared
            io.round.release.tag-object=${{ needs.preflight.outputs.tag_object }}
          cache-from: type=gha,scope=round-signaling
          cache-to: type=gha,mode=max,scope=round-signaling
          provenance: mode=max
          sbom: true

      - name: 시그널링 이미지의 서명된 출처 증명 발행
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAMESPACE }}/round-signaling
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  promote:
    name: 검증된 이미지 digest 승격
    needs:
      - preflight
      - build-edge
      - build-signaling
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: 저장소와 태그 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: 릴리스 태그 객체 불변성 확인
        shell: bash
        env:
          EXPECTED_TAG_OBJECT: ${{ needs.preflight.outputs.tag_object }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        run: |
          set -euo pipefail

          tag_ref="refs/tags/${RELEASE_TAG}"
          if ! current_tag_object="$(git rev-parse "${tag_ref}^{tag}" 2>/dev/null)"; then
            printf '승격 전에 릴리스 태그 %s가 사라졌거나 annotated tag가 아닙니다.\n' \
              "$RELEASE_TAG" >&2
            exit 1
          fi
          if [[ "$current_tag_object" != "$EXPECTED_TAG_OBJECT" ]]; then
            printf '승격 전에 릴리스 태그 객체가 변경되었습니다. 예상값 %s, 실제값 %s.\n' \
              "$EXPECTED_TAG_OBJECT" "$current_tag_object" >&2
            exit 1
          fi

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: GitHub Container Registry 로그인
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 모든 이미지 digest를 최종 태그로 승격
        shell: bash
        env:
          BATON_WEB_DIGEST: ${{ needs.build-edge.outputs.baton_web_digest }}
          EDGE_DIGEST: ${{ needs.build-edge.outputs.edge_digest }}
          RELAY_DIGEST: ${{ needs.build-edge.outputs.relay_digest }}
          SIGNALING_DIGEST: ${{ needs.build-signaling.outputs.digest }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
        run: |
          set -euo pipefail

          bash ops/ci/promote-image-tags.sh \
            "${IMAGE_NAMESPACE}/round-baton-web@${BATON_WEB_DIGEST}" \
            "${IMAGE_NAMESPACE}/round-baton-web:${RELEASE_TAG}" \
            "${IMAGE_NAMESPACE}/round-baton-web:sha-${RELEASE_SHA}" \
            "${IMAGE_NAMESPACE}/round-signaling@${SIGNALING_DIGEST}" \
            "${IMAGE_NAMESPACE}/round-signaling:${RELEASE_TAG}" \
            "${IMAGE_NAMESPACE}/round-signaling:sha-${RELEASE_SHA}" \
            "${IMAGE_NAMESPACE}/round-edge@${RELAY_DIGEST}" \
            "${IMAGE_NAMESPACE}/round-edge:${RELEASE_TAG}-relay" \
            "${IMAGE_NAMESPACE}/round-edge:sha-${RELEASE_SHA}-relay" \
            "${IMAGE_NAMESPACE}/round-edge@${EDGE_DIGEST}" \
            "${IMAGE_NAMESPACE}/round-edge:${RELEASE_TAG}" \
            "${IMAGE_NAMESPACE}/round-edge:sha-${RELEASE_SHA}"

      - name: 승격된 이미지 digest 기록
        shell: bash
        env:
          BATON_WEB_DIGEST: ${{ needs.build-edge.outputs.baton_web_digest }}
          EDGE_DIGEST: ${{ needs.build-edge.outputs.edge_digest }}
          RELAY_DIGEST: ${{ needs.build-edge.outputs.relay_digest }}
          SIGNALING_DIGEST: ${{ needs.build-signaling.outputs.digest }}
        run: |
          {
            printf '### 승격된 ROUND 이미지\n\n'
            printf -- '- 프로덕션 edge: `%s/round-edge@%s`\n' "$IMAGE_NAMESPACE" "$EDGE_DIGEST"
            printf -- '- 릴레이 전용 edge: `%s/round-edge@%s`\n' "$IMAGE_NAMESPACE" "$RELAY_DIGEST"
            printf -- '- BATON web: `%s/round-baton-web@%s`\n' "$IMAGE_NAMESPACE" "$BATON_WEB_DIGEST"
            printf -- '- 시그널링: `%s/round-signaling@%s`\n' "$IMAGE_NAMESPACE" "$SIGNALING_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
