name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 타입 검사, 테스트 및 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 저장소 checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.js 설정
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: npm 11 설정
        run: npm install --global npm@11.7.0 --no-audit --no-fund

      - name: Java 설정
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: 의존성 설치
        run: npm ci

      - name: 저장소 검사 실행
        run: npm run check

  browser-e2e:
    name: Chromium WebRTC 및 BATON edge smoke 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 저장소 checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.js 설정
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: npm 11 설정
        run: npm install --global npm@11.7.0 --no-audit --no-fund

      - name: Java 설정
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: 의존성 설치
        run: npm ci

      - name: Chromium 설치
        run: npx playwright install --with-deps chromium

      - name: Chromium 전체 미디어 smoke 테스트 실행
        run: npx playwright test --project=chromium-full-media --project=chromium-mobile-layout

      - name: BATON production edge 권한 부여 테스트 실행
        run: npm run test:e2e:baton-edge

      - name: 브라우저 진단 자료 업로드
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-diagnostics
          path: output/playwright/
          if-no-files-found: ignore
          retention-days: 7

  browser-webkit:
    name: WebKit 호환성 smoke 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 저장소 checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.js 설정
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: npm 11 설정
        run: npm install --global npm@11.7.0 --no-audit --no-fund

      - name: Java 설정
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: 의존성 설치
        run: npm ci

      - name: WebKit 설치
        run: npx playwright install --with-deps webkit

      - name: WebKit 직접 연결용 mDNS 설정
        run: |
          sudo apt-get install --yes --no-install-recommends avahi-daemon libnss-mdns
          sudo systemctl start avahi-daemon

      - name: WebKit 호환성 smoke 테스트 실행
        run: npx playwright test --project=webkit-smoke --project=webkit-mobile-layout

      - name: WebKit 진단 자료 업로드
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-webkit-diagnostics
          path: output/playwright/
          if-no-files-found: ignore
          retention-days: 7

  deployment:
    name: 배포 artifact 및 이미지 검증
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 저장소 checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.js 설정
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: npm 11 설정
        run: npm install --global npm@11.7.0 --no-audit --no-fund

      - name: 검증 의존성 설치
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends restic
          npm ci

      - name: 배포 검증
        run: bash ops/ci/validate-deployment.sh
