# 로컬 Prometheus의 /etc/prometheus 아래에 이 파일과 round-alerts.yml을 연결합니다.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/round-alerts.yml

scrape_configs:
  - job_name: round-signaling
    metrics_path: /actuator/prometheus
    static_configs:
      # 실제 k3s Service와 namespace 이름에 맞춥니다. 외부 Ingress로 노출하지 않습니다.
      - targets: ['round-signaling.round.svc.cluster.local:8787']
        labels:
          application: round-signaling
          environment: production
