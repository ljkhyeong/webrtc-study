# /etc/prometheus에 이 파일, round-alerts.yml, alertmanager-targets.yml을 연결합니다.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/round-alerts.yml
  # 선택한 연동의 규칙만 이 디렉터리에 연결합니다.
  - /etc/prometheus/optional-rules/*.yml

scrape_config_files:
  - /etc/prometheus/optional-scrapes/*.yml

alerting:
  alertmanagers:
    - file_sd_configs:
        - files: ['/etc/prometheus/alertmanager-targets.yml']

scrape_configs:
  - job_name: round-signaling
    metrics_path: /actuator/prometheus
    static_configs:
      # 실제 k3s Service와 namespace 이름에 맞춥니다. 외부 Ingress로 노출하지 않습니다.
      - targets: ['round-signaling.round.svc.cluster.local:8787']
        labels:
          application: round-signaling
          environment: production
