# Runtime-only values (realm, addresses, relay range, TLS files, and shared
# secret) are appended by entrypoint.sh into a tmpfs-backed configuration.
listening-ip=0.0.0.0
listening-port=3478
tls-listening-port=5349

fingerprint
use-auth-secret
stale-nonce=600
unauthorized-ratelimit
unauthorized-ratelimit-rps=10

no-multicast-peers

# Prevent a public TURN allocation from reaching host/private infrastructure.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=224.0.0.0-255.255.255.255

userdb=/tmp/turndb
pidfile=/tmp/turnserver.pid
log-file=stdout
simple-log

# The entrypoint starts as root only to read host-mounted TLS secrets. Coturn
# drops to this unprivileged account after listener and certificate setup.
proc-user=nobody
proc-group=nogroup
