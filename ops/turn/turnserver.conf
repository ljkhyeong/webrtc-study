# runtime 전용 값(realm, 주소, relay 범위, TLS 파일, shared secret)은 entrypoint.sh가
# tmpfs 기반 설정에 추가합니다.
listening-ip=0.0.0.0
listening-port=3478
tls-listening-port=5349

fingerprint
use-auth-secret
stale-nonce=600
unauthorized-ratelimit
unauthorized-ratelimit-rps=10

no-multicast-peers

# 공개 TURN allocation이 host/private infrastructure에 도달하지 못하게 합니다.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=224.0.0.0-255.255.255.255

userdb=/tmp/turndb
pidfile=/tmp/turnserver.pid
log-file=stdout
simple-log

# entrypoint는 host에 mount된 TLS secret을 읽기 위해서만 root로 시작합니다. Coturn은
# listener와 인증서 설정 후 이 비특권 계정으로 권한을 낮춥니다.
proc-user=nobody
proc-group=nogroup
