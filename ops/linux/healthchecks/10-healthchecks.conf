[Unit]
OnFailure=round-healthchecks-failure@%n.service

[Service]
# 모든 ExecStart가 성공한 뒤에만 알린다. 알림 전송 실패로 백업 결과를 바꾸지 않는다.
ExecStartPost=-/usr/bin/curl --disable --silent --fail --request POST --output /dev/null --connect-timeout 5 --max-time 10 --proto =https --config /etc/round/healthchecks/%n-success.curl
